<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F4C74" flood-opacity="0.12" />
    </filter>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1768AC"/>
      <stop offset="100%" stop-color="#4FD1C5"/>
    </linearGradient>
  </defs>

  <rect width="700" height="500" fill="#F4F8FA" rx="20"/>

  <g transform="translate(30, 25)" filter="url(#shadow3)">
    <rect width="640" height="450" fill="#FFFFFF" rx="16"/>
    <rect width="640" height="42" fill="#0F4C74" rx="16" clip-path="polygon(0 0, 640 0, 640 42, 0 42)"/>
    
    <circle cx="25" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="42" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="59" cy="21" r="5" fill="#27C93F"/>
    
    <text x="320" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Dokter Laundry — Laporan Keuangan &amp; Akuntansi Kas Riil</text>
    
    <!-- Action Button inside Header -->
    <rect x="510" y="9" width="114" height="24" rx="6" fill="#4FD1C5" fill-opacity="0.25"/>
    <text x="567" y="25" fill="#E4F5EC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📄 Ekspor PDF</text>

    <!-- Top 4 Summary Cards -->
    <g transform="translate(20, 56)">
      <!-- Card 1: Kas Masuk -->
      <g transform="translate(0, 0)">
        <rect width="142" height="74" rx="10" fill="#E4F5EC" stroke="#2E9E63" stroke-width="1.2"/>
        <text x="12" y="22" fill="#2E9E63" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">💰 KAS MASUK (RIIL)</text>
        <text x="12" y="46" fill="#122430" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Rp 14.850.000</text>
        <text x="12" y="62" fill="#2E9E63" font-family="system-ui, sans-serif" font-size="9.5">↑ 18.4% vs bln lalu</text>
      </g>

      <!-- Card 2: Piutang / Belum Lunas -->
      <g transform="translate(152, 0)">
        <rect width="142" height="74" rx="10" fill="#FBEBD8" stroke="#D9822B" stroke-width="1.2"/>
        <text x="12" y="22" fill="#D9822B" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">⏳ PIUTANG KONSUMEN</text>
        <text x="12" y="46" fill="#122430" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Rp 820.000</text>
        <text x="12" y="62" fill="#D9822B" font-family="system-ui, sans-serif" font-size="9.5">11 nota belum lunas</text>
      </g>

      <!-- Card 3: Biaya Operasional -->
      <g transform="translate(304, 0)">
        <rect width="142" height="74" rx="10" fill="#FDF2F2" stroke="#C23B32" stroke-width="1.2"/>
        <text x="12" y="22" fill="#C23B32" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">📉 PENGELUARAN</text>
        <text x="12" y="46" fill="#122430" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Rp 4.250.000</text>
        <text x="12" y="62" fill="#5C7180" font-family="system-ui, sans-serif" font-size="9.5">Deterjen, listrik, gaji</text>
      </g>

      <!-- Card 4: Laba Bersih -->
      <g transform="translate(456, 0)">
        <rect width="144" height="74" rx="10" fill="#EEF5F7" stroke="#1768AC" stroke-width="1.5"/>
        <text x="12" y="22" fill="#1768AC" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">✨ LABA BERSIH</text>
        <text x="12" y="46" fill="#0F4C74" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Rp 10.600.000</text>
        <text x="12" y="62" fill="#1768AC" font-family="system-ui, sans-serif" font-size="9.5">Margin sehat: 71.3%</text>
      </g>
    </g>

    <!-- Chart & Top Customers Section -->
    <g transform="translate(20, 142)">
      <!-- Left: Grafik Omzet Bulanan -->
      <rect width="360" height="236" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="24" fill="#0F4C74" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Grafik Omzet &amp; Tren 6 Bulan Terakhir</text>

      <!-- Bar Chart -->
      <g transform="translate(20, 48)">
        <!-- Grid lines -->
        <line x1="0" y1="20" x2="320" y2="20" stroke="#E2E8F0" stroke-dasharray="2,2"/>
        <line x1="0" y1="65" x2="320" y2="65" stroke="#E2E8F0" stroke-dasharray="2,2"/>
        <line x1="0" y1="110" x2="320" y2="110" stroke="#E2E8F0" stroke-dasharray="2,2"/>
        <line x1="0" y1="140" x2="320" y2="140" stroke="#CBD5E1"/>

        <!-- Bars -->
        <!-- Jun -->
        <rect x="20" y="70" width="28" height="70" rx="4" fill="#CBD5E1"/>
        <text x="34" y="156" fill="#5C7180" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Jun</text>

        <!-- Jul -->
        <rect x="70" y="55" width="28" height="85" rx="4" fill="#CBD5E1"/>
        <text x="84" y="156" fill="#5C7180" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Jul</text>

        <!-- Agu -->
        <rect x="120" y="45" width="28" height="95" rx="4" fill="#CBD5E1"/>
        <text x="134" y="156" fill="#5C7180" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Agu</text>

        <!-- Sep -->
        <rect x="170" y="40" width="28" height="100" rx="4" fill="#CBD5E1"/>
        <text x="184" y="156" fill="#5C7180" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Sep</text>

        <!-- Okt -->
        <rect x="220" y="25" width="28" height="115" rx="4" fill="#4FD1C5"/>
        <text x="234" y="156" fill="#5C7180" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Okt</text>

        <!-- Nov (Active/Peak) -->
        <rect x="270" y="10" width="28" height="130" rx="4" fill="url(#chartGrad)"/>
        <text x="284" y="156" fill="#1768AC" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Nov</text>
      </g>

      <!-- Right: Rekap Pelanggan Loyal -->
      <g transform="translate(372, 0)">
        <rect width="228" height="236" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="14" y="24" fill="#0F4C74" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Top 3 Pelanggan Terloyal</text>

        <!-- Customer 1 -->
        <g transform="translate(14, 40)">
          <rect width="200" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
          <text x="10" y="20" fill="#122430" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1. Ibu Sarah (VIP)</text>
          <text x="10" y="38" fill="#5C7180" font-family="system-ui, sans-serif" font-size="9.5">14 Order • 72 Kg</text>
          <text x="190" y="28" fill="#2E9E63" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">Rp 640k</text>
        </g>

        <!-- Customer 2 -->
        <g transform="translate(14, 100)">
          <rect width="200" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
          <text x="10" y="20" fill="#122430" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2. Kos Melati (Budi)</text>
          <text x="10" y="38" fill="#5C7180" font-family="system-ui, sans-serif" font-size="9.5">8 Order • 54 Kg</text>
          <text x="190" y="28" fill="#2E9E63" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">Rp 480k</text>
        </g>

        <!-- Customer 3 -->
        <g transform="translate(14, 160)">
          <rect width="200" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
          <text x="10" y="20" fill="#122430" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3. Dr. Rian Pratama</text>
          <text x="10" y="38" fill="#5C7180" font-family="system-ui, sans-serif" font-size="9.5">6 Order • Bedcover</text>
          <text x="190" y="28" fill="#2E9E63" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">Rp 375k</text>
        </g>
      </g>
    </g>

    <!-- Bottom Tip -->
    <g transform="translate(20, 390)">
      <rect width="600" height="34" rx="8" fill="#EEF5F7"/>
      <text x="300" y="21" fill="#0F4C74" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">💡 Berbasis Akuntansi Kas Riil: Uang masuk dihitung dari DP &amp; pelunasan nyata, bukan nota fiktif.</text>
    </g>
  </g>
</svg>